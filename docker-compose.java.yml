services:
  java-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yunlan}
      POSTGRES_USER: ${POSTGRES_USER:-yunlan}
      POSTGRES_PASSWORD: ${JAVA_DATABASE_PASSWORD:?JAVA_DATABASE_PASSWORD must be set}
    ports:
      - '5433:5432'
    volumes:
      - java-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  java-api:
    build:
      context: ./apps/java-api
    environment:
      JAVA_API_PORT: 8080
      JAVA_DATABASE_URL: jdbc:postgresql://java-db:5432/${POSTGRES_DB:-yunlan}
      JAVA_DATABASE_USERNAME: ${POSTGRES_USER:-yunlan}
      JAVA_DATABASE_PASSWORD: ${JAVA_DATABASE_PASSWORD:?JAVA_DATABASE_PASSWORD must be set}
      JAVA_JWT_SECRET: ${JAVA_JWT_SECRET:?JAVA_JWT_SECRET must be set}
      APP_DEV_SEED_ENABLED: ${APP_DEV_SEED_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      LEARNING_MODEL_BASE_URL: ${LEARNING_MODEL_BASE_URL:-}
      LEARNING_MODEL_API_KEY: ${LEARNING_MODEL_API_KEY:-}
      LEARNING_MODEL: ${LEARNING_MODEL:-gpt-4o-mini}
      LEARNING_MODEL_TIMEOUT_SECONDS: ${LEARNING_MODEL_TIMEOUT_SECONDS:-20}
    ports:
      - '8080:8080'
    depends_on:
      java-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  work-orders-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.work-orders
    ports:
      - '5173:80'
    depends_on:
      java-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/work-orders || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  java-db-data:
