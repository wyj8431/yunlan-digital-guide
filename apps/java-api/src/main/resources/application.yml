server:
  port: ${JAVA_API_PORT:8080}

spring:
  application:
    name: yunlan-java-api
  datasource:
    url: ${JAVA_DATABASE_URL:jdbc:postgresql://localhost:5432/yunlan}
    username: ${JAVA_DATABASE_USERNAME:yunlan}
    password: ${JAVA_DATABASE_PASSWORD:yunlan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  dev-seed-enabled: ${APP_DEV_SEED_ENABLED:false}
  auth:
    jwt-secret: ${JAVA_JWT_SECRET:local-development-secret-change-me}
    jwt-ttl-seconds: ${JAVA_JWT_TTL_SECONDS:3600}
  alerts:
    queue-size: ${ALERT_QUEUE_SIZE:100}
    concurrency: ${ALERT_CONCURRENCY:4}
    bucket-minutes: ${ALERT_BUCKET_MINUTES:5}
    shutdown-timeout-seconds: ${SHUTDOWN_TIMEOUT_SECONDS:10}
  learning:
    model-base-url: ${LEARNING_MODEL_BASE_URL:}
    model-api-key: ${LEARNING_MODEL_API_KEY:}
    model: ${LEARNING_MODEL:gpt-4o-mini}
    timeout-seconds: ${LEARNING_MODEL_TIMEOUT_SECONDS:20}
